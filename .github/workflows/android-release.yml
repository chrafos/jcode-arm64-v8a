name: Sync Upstream & Build Android arm64

on:
  schedule:
    # Run daily at 00:00 UTC to auto-check upstream releases/commits
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/1jehuang/jcode.git || true
          git fetch upstream
          # Merge upstream default branch (master or main) keeping our android patches intact
          UPSTREAM_BRANCH="master"
          if ! git rev-parse --verify upstream/$UPSTREAM_BRANCH >/dev/null 2>&1; then
            UPSTREAM_BRANCH="main"
          fi
          echo "Merging upstream/$UPSTREAM_BRANCH..."
          git merge -X ours upstream/$UPSTREAM_BRANCH -m "Auto-sync upstream $UPSTREAM_BRANCH" || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Build Jcode arm64
        env:
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          cargo build --release --target aarch64-linux-android --bin jcode
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all target/aarch64-linux-android/release/jcode
          mkdir -p dist
          cp target/aarch64-linux-android/release/jcode dist/jcode-arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcode-arm64-v8a
          path: dist/jcode-arm64-v8a

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          name: Jcode Android ARM64 (${{ github.ref_name || 'latest' }})
          files: dist/jcode-arm64-v8a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
