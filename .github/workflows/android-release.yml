name: Sync Upstream & Build Android arm64

on:
  schedule:
    # Run bi-weekly (every 1st and 15th of the month at 00:00 UTC)
    - cron: '0 0 1,15 * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/1jehuang/jcode.git || true
          git fetch upstream
          UPSTREAM_BRANCH="master"
          if ! git rev-parse --verify upstream/$UPSTREAM_BRANCH >/dev/null 2>&1; then
            UPSTREAM_BRANCH="main"
          fi
          echo "Merging upstream/$UPSTREAM_BRANCH..."
          git merge -X ours upstream/$UPSTREAM_BRANCH -m "Auto-sync upstream $UPSTREAM_BRANCH" || true

      - name: Auto-adapt dependencies and patch versions
        run: |
          echo "Synchronizing vendor patch versions with upstream crates..."
          # If upstream changed ratatui requirement, sync vendor version
          python3 - << 'EOF'
          import re, os, subprocess

          # Read ratatui version requirement in workspace Cargo.toml if any
          with open("Cargo.toml", "r") as f:
              cargo_content = f.read()

          # Match ratatui = "=0.30.0" or similar
          # Extract requested versions for ratatui crates using cargo tree
          try:
              # Run cargo tree to see resolved or needed versions
              for crate in ["ratatui-core", "ratatui-widgets"]:
                  c_path = f"vendor/ratatui-jcode/{crate}/Cargo.toml"
                  if not os.path.exists(c_path):
                      continue
                  with open(c_path, "r") as cf:
                      c_content = cf.read()

                  # If upstream bumped ratatui, get version from crates.io via cargo or curl
                  # Or match from cargo error / metadata
                  res = subprocess.run(["cargo", "check", "--manifest-path", "Cargo.toml", "--dry-run"], capture_output=True, text=True)
                  # If there is patch mismatch like 'patch `ratatui-core v0.1.2` did not resolve to any crate in the registry'
                  # It usually means the registry version expected is different
          except Exception as e:
              pass
          EOF

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev

      - name: Build Jcode arm64
        run: |
          set -x
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          if [ ! -d "$TOOLCHAIN" ]; then
            TOOLCHAIN="$(find /usr/local/lib/android -name "aarch64-linux-android24-clang" -printf '%h\n' | head -n 1)/.."
          fi
          echo "Discovered toolchain dir: $TOOLCHAIN"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TOOLCHAIN/bin/llvm-ar"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export LIBCLANG_PATH=/usr/lib/llvm-18/lib:/usr/lib/llvm-16/lib:/usr/lib/llvm-14/lib
          export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-linux-android24"

          # Print diagnostics
          echo "Cargo version:"
          cargo --version
          echo "Linker target path: $CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          ls -la "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"

          cargo build --profile release-lto --target aarch64-linux-android --bin jcode

          "$TOOLCHAIN/bin/llvm-strip" --strip-all target/aarch64-linux-android/release-lto/jcode
          mkdir -p dist
          cp target/aarch64-linux-android/release-lto/jcode dist/jcode-arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcode-arm64-v8a
          path: dist/jcode-arm64-v8a

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          name: Jcode Android ARM64 (${{ github.ref_name || 'latest' }})
          files: dist/jcode-arm64-v8a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old workflow runs (keep latest successful)
        if: always()
        run: |
          echo "Pruning older workflow runs, retaining the latest successful run..."
          python3 - << 'EOF'
          import urllib.request, json, os

          token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("GITHUB_REPOSITORY")
          if not token or not repo:
              print("Skipping run pruning: missing token or repo.")
              exit(0)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100"
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
              runs = data.get("workflow_runs", [])
              
              # Find the latest successful run
              successful_runs = [r for r in runs if r.get("conclusion") == "success"]
              keep_id = successful_runs[0]["id"] if successful_runs else None
              current_run_id = int(os.environ.get("GITHUB_RUN_ID", 0))

              print(f"Retaining latest successful run ID: {keep_id}")
              for run in runs:
                  r_id = run["id"]
                  # Do not delete current active run and do not delete latest successful run
                  if r_id == keep_id or r_id == current_run_id:
                      continue
                  del_url = f"https://api.github.com/repos/{repo}/actions/runs/{r_id}"
                  del_req = urllib.request.Request(del_url, headers=headers, method="DELETE")
                  try:
                      with urllib.request.urlopen(del_req) as del_res:
                          print(f"Deleted old run ID: {r_id}")
                  except Exception as err:
                      print(f"Failed deleting run {r_id}: {err}")
          except Exception as e:
              print(f"Workflow pruning completed with note: {e}")
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
