name: Sync Upstream & Build Android arm64

on:
  schedule:
    # Run bi-weekly (every 1st and 15th of the month at 00:00 UTC)
    - cron: '0 0 1,15 * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/1jehuang/jcode.git || true
          git fetch upstream
          UPSTREAM_BRANCH="master"
          if ! git rev-parse --verify upstream/$UPSTREAM_BRANCH >/dev/null 2>&1; then
            UPSTREAM_BRANCH="main"
          fi
          echo "Merging upstream/$UPSTREAM_BRANCH..."
          git merge -X ours upstream/$UPSTREAM_BRANCH -m "Auto-sync upstream $UPSTREAM_BRANCH" || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev

      - name: Build Jcode arm64
        run: |
          set -x
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT: $ANDROID_NDK_ROOT"
          NDK_DIR="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Searching for NDK..."
            find /usr/local/lib/android -name "toolchains" 2>/dev/null || true
            find /opt -name "toolchains" 2>/dev/null || true
            exit 1
          fi
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN dir: $TOOLCHAIN"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TOOLCHAIN/bin/llvm-ar"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export LIBCLANG_PATH=/usr/lib/llvm-18/lib:/usr/lib/llvm-16/lib:/usr/lib/llvm-14/lib
          export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-linux-android24"

          # Run cargo and save log to file
          cargo build --release --target aarch64-linux-android --bin jcode > cargo_build.log 2>&1 || BUILD_FAILED=1

          if [ "$BUILD_FAILED" = "1" ]; then
            echo "==================== CARGO BUILD FAILED ===================="
            tail -n 100 cargo_build.log
            echo "============================================================"
            exit 1
          fi

          "$TOOLCHAIN/bin/llvm-strip" --strip-all target/aarch64-linux-android/release/jcode
          mkdir -p dist
          cp target/aarch64-linux-android/release/jcode dist/jcode-arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcode-arm64-v8a
          path: dist/jcode-arm64-v8a

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          name: Jcode Android ARM64 (${{ github.ref_name || 'latest' }})
          files: dist/jcode-arm64-v8a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
